<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간호사 노티 훈련</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app app--kakao-home">
    <header class="kakao-home-header">
      <div class="kakao-home-header__top">
        <h1 class="kakao-home-header__title">노티 훈련</h1>
        <div class="kakao-home-header__actions" aria-hidden="true">
          <span class="kakao-icon">⌕</span>
          <span class="kakao-icon">＋</span>
          <span class="kakao-icon">☰</span>
        </div>
      </div>
      <p class="kakao-home-header__sub">의사에게 SBAR 노티 연습</p>
    </header>

    <main class="chat-room-list" id="scenarioList">
      <!-- 시나리오 = 채팅방 행으로 렌더링 -->
    </main>
  </div>

  <script src="js/data.js?v=4"></script>
  <script src="js/chat-engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof renderScenarioList === "function") {
        renderScenarioList("scenarioList");
      }
    });
  </script>
</body>
</html>
