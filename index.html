<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간호사 노티 훈련</title>
  <meta name="theme-color" content="#3a7bd5" />
  <meta name="application-name" content="간호사 노티 훈련" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="노티 훈련" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app app--kakao-home">
    <header class="kakao-home-header">
      <div class="kakao-home-header__top">
        <h1 class="kakao-home-header__title">노티 훈련</h1>
        <div class="kakao-home-header__actions" aria-hidden="true">
          <span class="kakao-icon">⌕</span>
          <span class="kakao-icon">＋</span>
          <span class="kakao-icon">☰</span>
        </div>
      </div>
      <p class="kakao-home-header__sub">의사에게 SBAR 노티 연습</p>
    </header>

    <main class="chat-room-list" id="scenarioList">
      <!-- 시나리오 = 채팅방 행으로 렌더링 -->
    </main>
  </div>

  <script src="js/data.js?v=5"></script>
  <script src="js/chat-engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof renderScenarioList === "function") {
        renderScenarioList("scenarioList");
      }
    });
  </script>
</body>
</html>
