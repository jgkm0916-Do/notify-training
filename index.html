<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>노티 연습</title>
  <meta name="theme-color" content="#3a7bd5" />
  <meta name="application-name" content="노티 연습" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="노티 연습" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app app--kakao-home">
    <header class="kakao-home-header">
      <div class="kakao-home-header__top">
        <h1 class="kakao-home-header__title">노티 연습</h1>
      </div>
      <p class="kakao-home-header__sub">의사에게 SBAR 노티 연습</p>

      <nav class="level-tabs" id="levelTabs" role="tablist" aria-label="난이도">
        <button type="button" class="level-tabs__btn is-active" role="tab" aria-selected="true" data-level="1">초급</button>
        <button type="button" class="level-tabs__btn" role="tab" aria-selected="false" data-level="2">중급</button>
        <button type="button" class="level-tabs__btn" role="tab" aria-selected="false" data-level="3">고급</button>
      </nav>

      <p class="level-preview" id="levelPreview" aria-live="polite"></p>
    </header>

    <main class="chat-room-list" id="scenarioList" role="tabpanel">
      <!-- 선택한 난이도 시나리오만 렌더링 -->
    </main>
  </div>

  <script src="js/data.js?v=15"></script>
  <script src="js/chat-engine.js?v=17"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof initHomePage === "function") {
        initHomePage();
      } else if (typeof renderScenarioList === "function") {
        renderScenarioList("scenarioList");
      }
    });
  </script>
</body>
</html>
