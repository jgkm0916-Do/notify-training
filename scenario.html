<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>시나리오 — 노티 훈련</title>
  <meta name="theme-color" content="#3a7bd5" />
  <meta name="application-name" content="간호사 노티 훈련" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="노티 훈련" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    .app--scenario {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }

    .app--scenario .chat-header {
      flex-shrink: 0;
    }

    .scenario-prep {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f5f7fa;
    }

    /* ===== 환자 차트 도크 ===== */
    .chart-dock {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #f5f7fa;
      border-bottom: 1px solid var(--border, #e5e5e5);
    }

    .scenario-prep:not(.scenario-prep--calling) .chart-dock {
      flex: 1;
      max-height: none;
    }

    .scenario-prep--calling .chart-dock {
      max-height: 42vh;
    }

    .chart-dock__toolbar {
      flex-shrink: 0;
      display: flex;
      justify-content: flex-end;
      padding: 0.45rem 1rem 0.25rem;
    }

    .chart-toggle {
      border: 1px solid var(--border, #e5e5e5);
      background: #fff;
      color: #555;
      border-radius: 999px;
      padding: 0.28rem 0.75rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .chart-toggle:hover {
      background: #f7f8fa;
    }

    .chart-dock__scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chart-dock.is-collapsed .chart-dock__scroll {
      display: none;
    }

    .scenario-prep--calling .chart-dock.is-collapsed {
      max-height: none;
    }

    .chart-cards {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chart-card {
      background: #fff;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
    }

    .chart-card__title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent, #3a7bd5);
      margin-bottom: 0.2rem;
    }

    .chart-card__body {
      font-size: 0.9rem;
    }

    .chart-card__text {
      margin: 0;
      line-height: 1.45;
      word-break: keep-all;
    }

    .call-actions {
      padding: 0 1rem 1.25rem;
    }

    .patient-banner {
      margin-bottom: 0.65rem;
      padding: 0.65rem 0.85rem;
      background: #fff;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* ===== 대화 섹션 ===== */
    .call-section {
      flex: 1;
      min-height: 0;
      margin: 0;
      border: none;
      border-radius: 0;
      overflow: hidden;
      background: var(--bg, #b2c7d9);
      display: flex;
      flex-direction: column;
    }

    .call-section[hidden] {
      display: none !important;
    }

    .kakao-bar {
      flex-shrink: 0;
      background: #fee500;
      color: #191919;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.7rem 0.75rem;
      letter-spacing: -0.01em;
    }

    .call-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .call-chat {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-height: 0;
    }

    .msg__name {
      font-size: 0.72rem;
      color: #555;
      margin-bottom: 0.2rem;
      padding: 0 0.15rem;
    }

    .msg--me .msg__name {
      text-align: right;
    }

    .notify-composer {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem;
      background: #fff;
      border-top: 1px solid var(--border, #e5e5e5);
      align-items: flex-end;
    }

    .notify-composer textarea {
      flex: 1;
      min-height: 72px;
      max-height: 140px;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.4;
      resize: vertical;
    }

    .notify-composer textarea:focus {
      outline: 2px solid rgba(58, 123, 213, 0.35);
      border-color: var(--accent, #3a7bd5);
    }

    .notify-send {
      flex-shrink: 0;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 10px;
      background: var(--accent, #3a7bd5);
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .notify-send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .feedback-checklist {
      margin: 0;
      padding: 1rem;
      background: #fff;
      border-top: 1px solid var(--border, #e5e5e5);
      font-size: 0.9rem;
    }

    .feedback-checklist__summary {
      font-weight: 700;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .feedback-checklist__list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .feedback-checklist__item {
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      background: #f7f8fa;
    }

    .feedback-checklist__item--hit {
      background: #eafaf1;
    }

    .feedback-checklist__item--miss {
      background: #fdecea;
    }

    .feedback-checklist__row {
      display: flex;
      gap: 0.4rem;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .feedback-checklist__mark {
      font-weight: 700;
      width: 1.2em;
    }

    .feedback-checklist__cat {
      font-size: 0.72rem;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      background: #e8eef7;
      color: #2a5a9e;
    }

    .feedback-checklist__hint,
    .feedback-checklist__explain {
      margin-top: 0.35rem;
      font-size: 0.82rem;
      line-height: 1.4;
      padding-left: 1.5em;
      word-break: keep-all;
    }

    .feedback-checklist__item--hit .feedback-checklist__explain {
      color: #1e6b3a;
    }

    .feedback-checklist__item--miss .feedback-checklist__explain {
      color: #8a2a22;
    }

    .feedback-checklist__rationale {
      margin: 0.3rem 0 0;
      padding: 0.45rem 0.65rem;
      margin-left: 1.5em;
      background: #f7f4ef;
      border-left: 3px solid #b08900;
      border-radius: 6px;
      font-size: 0.8rem;
      line-height: 1.45;
      color: #5c4a1a;
      word-break: keep-all;
    }

    .feedback-checklist__lead {
      font-size: 0.85rem;
      color: #666;
      margin: 0 0 0.75rem;
    }

    .feedback-checklist__section {
      font-size: 0.85rem;
      font-weight: 700;
      margin: 0.85rem 0 0.45rem;
      color: #333;
    }

    .feedback-checklist__status {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 600;
      color: #666;
    }

    .feedback-checklist__item--hit .feedback-checklist__status {
      color: #1e6b3a;
    }

    .feedback-checklist__item--miss .feedback-checklist__status {
      color: #8a2a22;
    }

    .feedback-checklist__all-ok {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #1e6b3a;
      font-weight: 600;
    }

    .feedback-checklist__r-notice {
      margin: 0 0 0.75rem;
      padding: 0.65rem 0.85rem;
      background: #fff8e6;
      border-left: 4px solid #e6a800;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #6b4e00;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="app app--scenario" id="appRoot">
    <header class="chat-header">
      <a class="chat-header__back" href="index.html" aria-label="목록으로">←</a>
      <div>
        <div class="chat-header__name" id="scenarioTitle">시나리오</div>
        <div class="chat-header__role" id="scenarioRole">차트를 확인한 뒤 의사에게 노티하세요</div>
      </div>
    </header>

    <main class="scenario-prep" id="scenarioMain">
      <section class="chart-dock" id="chartDock">
        <div class="chart-dock__toolbar">
          <button
            type="button"
            class="chart-toggle"
            id="chartToggleBtn"
            aria-expanded="true"
            aria-controls="chartScroll"
          >
            차트 접기
          </button>
        </div>
        <div class="chart-dock__scroll" id="chartScroll">
          <section id="triggerArea"></section>
          <section class="chart-panel" id="chartArea"></section>
          <div class="call-actions" id="callActions">
            <button type="button" class="btn-primary" id="callBtn">의사에게 노티하기</button>
          </div>
        </div>
      </section>

      <section class="call-section" id="callSection" hidden>
        <div class="kakao-bar" id="kakaoBar">의사</div>
        <div class="call-scroll" id="callScroll">
          <div class="call-chat" id="chatBody"></div>
          <div id="feedbackSlot"></div>
        </div>
        <form class="notify-composer" id="notifyComposer" autocomplete="off">
          <textarea
            id="notifyInput"
            name="notify"
            placeholder="SBAR에 맞춰 노티 내용을 입력하세요…"
            rows="3"
          ></textarea>
          <button type="submit" class="notify-send" id="notifySend">전송</button>
        </form>
      </section>
    </main>
  </div>

  <script src="js/data.js?v=5"></script>
  <script src="js/scoring.js"></script>
  <script src="js/chat-engine.js"></script>
  <script>
    let session = null;
    let callStarted = false;
    let partnerLabel = "의사";

    document.addEventListener("DOMContentLoaded", () => {
      session = initScenarioPage();
      if (!session) return;

      const callBtn = document.getElementById("callBtn");
      if (callBtn) {
        callBtn.addEventListener("click", startCall);
      }

      const form = document.getElementById("notifyComposer");
      if (form) {
        form.addEventListener("submit", onNotifySubmit);
      }

      const chartToggleBtn = document.getElementById("chartToggleBtn");
      if (chartToggleBtn) {
        chartToggleBtn.addEventListener("click", toggleChartDock);
      }
    });

    function toggleChartDock() {
      const dock = document.getElementById("chartDock");
      const btn = document.getElementById("chartToggleBtn");
      if (!dock || !btn) return;

      const collapsed = dock.classList.toggle("is-collapsed");
      btn.textContent = collapsed ? "차트 펼치기" : "차트 접기";
      btn.setAttribute("aria-expanded", String(!collapsed));
    }

    function startCall() {
      if (!session || callStarted) return;
      callStarted = true;
      session.step = "notify";
      initNotifyConversation(session);

      const callBtn = document.getElementById("callBtn");
      const callActions = document.getElementById("callActions");
      if (callBtn) {
        callBtn.hidden = true;
        callBtn.disabled = true;
      }
      if (callActions) callActions.hidden = true;

      document.getElementById("scenarioMain")?.classList.add("scenario-prep--calling");

      partnerLabel = getPartnerLabel(session.scenario);
      const kakaoBar = document.getElementById("kakaoBar");
      if (kakaoBar) kakaoBar.textContent = partnerLabel;

      const callSection = document.getElementById("callSection");
      const chatBody = document.getElementById("chatBody");
      chatBody.innerHTML = "";
      appendMessage(
        chatBody,
        {
          sender: "partner",
          text: "네, 말씀하세요.",
          time: nowHHMM()
        },
        { partnerLabel }
      );

      callSection.hidden = false;
      document.getElementById("notifyInput")?.focus();
    }

    function onNotifySubmit(e) {
      e.preventDefault();
      if (!session || session.notifyFinished) return;

      const input = document.getElementById("notifyInput");
      const text = (input?.value || "").trim();
      if (!text) {
        input?.focus();
        return;
      }

      const result = handleNotifySubmit(
        session,
        text,
        document.getElementById("chatBody"),
        document.getElementById("feedbackSlot"),
        partnerLabel
      );

      if (input) {
        input.value = "";
        if (result?.done) {
          input.disabled = true;
          document.getElementById("notifySend").disabled = true;
        } else if (result?.followUp) {
          input.placeholder = "의사 질문에 답변하세요…";
          input.focus();
        }
      }
    }
  </script>
</body>
</html>
